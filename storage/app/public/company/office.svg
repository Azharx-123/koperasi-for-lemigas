<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B4652"/>
      <stop offset="100%" stop-color="#6C757D"/>
    </linearGradient>
    <linearGradient id="towerA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B3238"/>
      <stop offset="100%" stop-color="#454E56"/>
    </linearGradient>
    <linearGradient id="towerB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A424A"/>
      <stop offset="100%" stop-color="#545E67"/>
    </linearGradient>
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE55C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant skyline, low detail -->
  <g opacity="0.35" fill="#2B3238">
    <rect x="0" y="560" width="90" height="220"/>
    <rect x="110" y="600" width="70" height="180"/>
    <rect x="1430" y="580" width="80" height="200"/>
    <rect x="1520" y="620" width="80" height="160"/>
  </g>

  <!-- ground -->
  <rect x="0" y="780" width="1600" height="120" fill="#454E56"/>

  <!-- main headquarters tower -->
  <g>
    <rect x="620" y="220" width="260" height="560" fill="url(#towerA)"/>
    <!-- window grid -->
    <g fill="url(#glassPanel)">
      <!-- generated grid of windows -->
      <rect x="644" y="250" width="30" height="40"/><rect x="690" y="250" width="30" height="40"/><rect x="736" y="250" width="30" height="40"/><rect x="782" y="250" width="30" height="40"/><rect x="828" y="250" width="30" height="40"/>
      <rect x="644" y="306" width="30" height="40"/><rect x="690" y="306" width="30" height="40"/><rect x="736" y="306" width="30" height="40"/><rect x="782" y="306" width="30" height="40"/><rect x="828" y="306" width="30" height="40"/>
      <rect x="644" y="362" width="30" height="40"/><rect x="690" y="362" width="30" height="40"/><rect x="736" y="362" width="30" height="40"/><rect x="782" y="362" width="30" height="40"/><rect x="828" y="362" width="30" height="40"/>
      <rect x="644" y="418" width="30" height="40"/><rect x="690" y="418" width="30" height="40"/><rect x="736" y="418" width="30" height="40"/><rect x="782" y="418" width="30" height="40"/><rect x="828" y="418" width="30" height="40"/>
      <rect x="644" y="474" width="30" height="40"/><rect x="690" y="474" width="30" height="40"/><rect x="736" y="474" width="30" height="40"/><rect x="782" y="474" width="30" height="40"/><rect x="828" y="474" width="30" height="40"/>
      <rect x="644" y="530" width="30" height="40"/><rect x="690" y="530" width="30" height="40"/><rect x="736" y="530" width="30" height="40"/><rect x="782" y="530" width="30" height="40"/><rect x="828" y="530" width="30" height="40"/>
      <rect x="644" y="586" width="30" height="40"/><rect x="690" y="586" width="30" height="40"/><rect x="736" y="586" width="30" height="40"/><rect x="782" y="586" width="30" height="40"/><rect x="828" y="586" width="30" height="40"/>
      <rect x="644" y="642" width="30" height="40"/><rect x="690" y="642" width="30" height="40"/><rect x="736" y="642" width="30" height="40"/><rect x="782" y="642" width="30" height="40"/><rect x="828" y="642" width="30" height="40"/>
      <rect x="644" y="698" width="30" height="40"/><rect x="690" y="698" width="30" height="40"/><rect x="736" y="698" width="30" height="40"/><rect x="782" y="698" width="30" height="40"/><rect x="828" y="698" width="30" height="40"/>
    </g>
