      <rect x="404" y="460" width="26" height="34"/><rect x="444" y="460" width="26" height="34"/><rect x="484" y="460" width="26" height="34"/><rect x="524" y="460" width="26" height="34"/>
      <rect x="404" y="510" width="26" height="34"/><rect x="444" y="510" width="26" height="34"/><rect x="484" y="510" width="26" height="34"/><rect x="524" y="510" width="26" height="34"/>
      <rect x="404" y="560" width="26" height="34"/><rect x="444" y="560" width="26" height="34"/><rect x="484" y="560" width="26" height="34"/><rect x="524" y="560" width="26" height="34"/>
      <rect x="404" y="610" width="26" height="34"/><rect x="444" y="610" width="26" height="34"/><rect x="484" y="610" width="26" height="34"/><rect x="524" y="610" width="26" height="34"/>
      <rect x="404" y="660" width="26" height="34"/><rect x="444" y="660" width="26" height="34"/><rect x="484" y="660" width="26" height="34"/><rect x="524" y="660" width="26" height="34"/>
      <rect x="404" y="710" width="26" height="34"/><rect x="444" y="710" width="26" height="34"/><rect x="484" y="710" width="26" height="34"/><rect x="524" y="710" width="26" height="34"/>
    </g>
  </g>

  <!-- right tower -->
  <g>
    <rect x="900" y="330" width="220" height="450" fill="url(#towerB)"/>
    <g fill="url(#glassPanel)" opacity="0.9">
      <rect x="924" y="360" width="28" height="36"/><rect x="966" y="360" width="28" height="36"/><rect x="1008" y="360" width="28" height="36"/><rect x="1050" y="360" width="28" height="36"/><rect x="1092" y="360" width="28" height="36"/>
      <rect x="924" y="414" width="28" height="36"/><rect x="966" y="414" width="28" height="36"/><rect x="1008" y="414" width="28" height="36"/><rect x="1050" y="414" width="28" height="36"/><rect x="1092" y="414" width="28" height="36"/>
      <rect x="924" y="468" width="28" height="36"/><rect x="966" y="468" width="28" height="36"/><rect x="1008" y="468" width="28" height="36"/><rect x="1050" y="468" width="28" height="36"/><rect x="1092" y="468" width="28" height="36"/>
      <rect x="924" y="522" width="28" height="36"/><rect x="966" y="522" width="28" height="36"/><rect x="1008" y="522" width="28" height="36"/><rect x="1050" y="522" width="28" height="36"/><rect x="1092" y="522" width="28" height="36"/>
      <rect x="924" y="576" width="28" height="36"/><rect x="966" y="576" width="28" height="36"/><rect x="1008" y="576" width="28" height="36"/><rect x="1050" y="576" width="28" height="36"/><rect x="1092" y="576" width="28" height="36"/>
      <rect x="924" y="630" width="28" height="36"/><rect x="966" y="630" width="28" height="36"/><rect x="1008" y="630" width="28" height="36"/><rect x="1050" y="630" width="28" height="36"/><rect x="1092" y="630" width="28" height="36"/>
      <rect x="924" y="684" width="28" height="36"/><rect x="966" y="684" width="28" height="36"/><rect x="1008" y="684" width="28" height="36"/><rect x="1050" y="684" width="28" height="36"/><rect x="1092" y="684" width="28" height="36"/>
    </g>
  </g>

  <!-- foreground silhouette trees for depth -->
  <g fill="#2B3238" opacity="0.5">
    <ellipse cx="200" cy="770" rx="60" ry="90"/>
    <ellipse cx="1400" cy="770" rx="70" ry="100"/>
  </g>
</svg>
